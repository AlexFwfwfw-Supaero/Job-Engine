             separate from the TalentLink feed under the ONERA entry. DEMR is
             electromagnetics and radar, DTIS information processing and
             systems; DOTA, DPHY and DMPE are optics, physics and energy.
             CRITICAL: each page lists filled positions under 'Pourvu' FIRST
             and open ones under 'A pourvoir' second. Only the latter are
             polled. Postings are stored at level phd, so they are priced
             against a doctoral salary rather than a graduate one.
             read_everything is on here for a reason this board makes plain:
             a research institute writes a bespoke title per thesis, so a
             keyword list is the wrong instrument. Asked to read the theses
             it had rejected, the model scored a cold-atom interferometer and
             a Langatate MEMS gyroscope 0.62 each and called both foundational
             to inertial navigation — neither matched a single keyword. 104
             theses is twenty minutes of model time; Safran's 3803 would be
             twelve hours, which is why this is per employer and not global."}

