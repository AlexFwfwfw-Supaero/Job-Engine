  # --- engineering consultancies ---
  # The consulting channel. These firms place engineers into Airbus, Thales,
  # CNES, ESA and the OEMs, so a large share of the entry-level navigation and
  # radar work in France is hired through them rather than by the prime
  # directly. They advertise most heavily on LinkedIn, which cannot be polled —
  # but the three below run public SmartRecruiters boards carrying the same
  # postings, with a per-posting country, which is more than Workday gives us.
  - {name: ALTEN, country: FR, city: Boulogne-Billancourt, ats: smartrecruiters,
     ats_endpoint: "alten", poll_enabled: true, tags: [consulting, radar, navigation],
     careers_url: "https://www.alten.fr/nos-offres/",
     notes: "CONFIRMED 2026-07-27 — SmartRecruiters 'alten', ~1100 postings.
             Mostly non-relevant; the matcher discards them. Places into Airbus,
             Thales, Safran, Dassault."}
  - {name: Assystem, country: FR, city: Courbevoie, ats: smartrecruiters,
     ats_endpoint: "assystem", poll_enabled: true, tags: [consulting, systems],
     careers_url: "https://www.assystem.com/en/careers/",
     notes: "CONFIRMED 2026-07-27 — SmartRecruiters 'assystem', ~990 postings.
             Nuclear-heavy, but carries space and defence systems work."}
  - {name: Scalian, country: FR, city: Toulouse, ats: smartrecruiters,
