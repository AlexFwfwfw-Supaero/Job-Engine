weights: {comp: 0.30, qol: 0.20, fit: 0.50}
qol_weights: {sunshine: 0.45, nature: 0.35, rent: 0.20}
sunshine_range: [1300, 2900]
rent_range: [400, 1800]

excluded_countries: [GB]
known_languages: [en, fr, es, pt]
language_keywords:
  de: ["german language", "deutschkenntnisse", "fluent german", "german is required"]
  nl: ["dutch language", "fluent dutch"]

negative_keywords:
  - "land surveyor"
  - "surveying technician"
  - "gis technician"
  - "account manager"
  - "sales representative"
  - "field service"
  - "business development"

staleness:
  applied: [14, 30]
  phd: [21, 45]

# Terms sent to ATS platforms that support server-side search (Workday).
# One query per term, results unioned, then filtered by role_families above.
# Keep this list short and distinctive: each term costs a request, and broad
# words like "engineer" return thousands of irrelevant rows.
poll_search_terms:
  - gnss
  - galileo
  - egnos
  - navigation
  - pnt
  - radar
  - sensor fusion
  - kalman
  - inertial
  - signal processing
  - orbit determination
  - r&t
  - research engineer
  - études amont

# R&D and R&T describe the *kind* of work, not its subject. These terms lift a
# posting that already matched a role family below and do nothing to one that
# did not, which is what keeps "Research Scientist, Metallurgy" at zero while
# ranking "GNSS Research Engineer" above a plain GNSS role.
# There is deliberately no standalone research role family: research only
# counts here when it is research in radar, navigation or signal processing.
role_modifiers:
  weight: 0.20
  keywords: ["r&d", "r&t", "research", "recherche", "innovation",
             "advanced", "demonstrator", "prototype", "études amont",
             "etudes amont", "phd", "doctoral"]

role_families:
  - name: gnss
    weight: 1.0
    keywords: ["gnss", "gps", "galileo", "egnos", "sbas", "waas", "glonass",
               "beidou", "receiver", "signal processing",
               "correlator", "acquisition and tracking", "rtk", "ppp"]
  - name: pnt
    weight: 1.0
    keywords: ["pnt", "integrity", "spoofing", "jamming", "interference",
               "anti-jam", "raim", "resilient navigation", "timing"]
  - name: navigation_systems
    weight: 0.9
    keywords: ["navigation", "avionics", "guidance navigation and control",
               "gnc", "flight dynamics", "orbit determination",
               "navigation payload"]
  - name: sensor_fusion
    weight: 0.9
    keywords: ["sensor fusion", "kalman", "estimation", "inertial", "imu",
               "ins", "state estimation", "slam"]
  - name: radar
    weight: 0.8
    keywords: ["radar", "sar", "doppler", "waveform", "beamforming",
               "electromagnetic", "rf front-end", "rf", "antenna", "microwave",
               "radio frequency", "electronic warfare", "phased array"]
  - name: adjacent
    weight: 0.5
    keywords: ["autonomous driving", "geodesy", "remote sensing",
               "digital signal processing", "software defined radio"]
