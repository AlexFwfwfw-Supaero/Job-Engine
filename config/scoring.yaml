weights: {comp: 0.30, qol: 0.20, fit: 0.50}
qol_weights: {sunshine: 0.45, nature: 0.35, rent: 0.20}
sunshine_range: [1300, 2900]
rent_range: [400, 1800]

# GB: no right to work post-Brexit. The rest are out of the search area —
# consulting boards are global, and SmartRecruiters reports a real
# per-posting country, so these can finally be dropped rather than stored
# under the employer's headquarters.
excluded_countries: [GB, US, CA, MX, BR, IN, CN, SG, JP, KR, AU, NZ,
                     AE, SA, QA, IL, ZA, MA, EG, RU]
known_languages: [en, fr, es, pt]
language_keywords:
  de: ["german language", "deutschkenntnisse", "fluent german", "german is required"]
  nl: ["dutch language", "fluent dutch"]

# Matched against the title only, accent-insensitively, and only from the start
# of a word: "ingenieur commercial" catches "ingénieur commercial", while
# "formation" no longer catches "Geo Information". These reject outright — a
# posting that hits one is never stored and you never see it — so the list is
# limited to work that is unambiguously not engineering.
#
# What is deliberately NOT here: management and quality. "Responsable" in French
# is usually a technical lead, and rejecting it would have deleted a shortlisted
# "Ingénieur Responsable technique de station GNSS"; "quality" would have
# deleted a shortlisted "Avionics Quality Engineer". The screening prompt scores
# those down instead, which leaves them visible and arguable.
#
# The French and German entries are not decoration: nine of nineteen polled
# employers post in French and six in German, and until these existed a
# "Vertriebsingenieur Navigation" and an "ingénieur commercial navigation" both
# scored 0.45 and were stored.
negative_keywords:
  - "land surveyor"
  - "surveying technician"
  - "gis technician"
  - "account manager"
  - "sales representative"
  - "field service"
  - "business development"
  # French
  - "ingenieur commercial"
  - "charge d'affaires"
  - "chargee d'affaires"
  - "developpement commercial"
  - "attache commercial"
  - "geometre"
  - "technico-commercial"
  # German
  - "vertriebsingenieur"
  - "vertriebsmitarbeiter"
  - "vertriebsleiter"
  # Außendienst: ß folds to ss, so the folded spelling is what to write here.
  - "aussendienst"
  - "kundenberater"
  - "vermessungstechniker"

  # Shop floor and instrument operation. The tools these people use are the
  # ones this search is about, so the titles read close to a match; the work is
  # executing a design rather than producing one.
  - "technicien"
  - "technicienne"
  - "technician"
  - "techniker"
  - "operateur"
  - "operatrice"
  - "operator"
  - "monteur"
  - "monteuse"
  - "ajusteur"
  - "ajusteuse"
  - "soudeur"
  - "usineur"
  - "chaudronnier"
  - "cableur"
  - "regleur"
  - "mecanicien"
  - "electricien"
  - "mecaniker"
  - "elektriker"
  - "schlosser"
  - "montage"
  # Spanish, for the sitemap boards. PLD Space alone advertises eighteen
  # shop-floor titles — laminado, autoclave, mecanizado, soldadura.
  # "tecnico" is deliberately absent for the same reason "responsable" is:
  # in Spain "Ingeniero Técnico" is a degree-level engineer, so rejecting the
  # word would throw away real engineering roles to catch shop-floor ones the
  # role families already ignore.
  - "operario"
  - "operaria"
  - "soldador"
  - "montador"
  - "electricista"

  # Administration and support functions.
  - "assistant"
  - "assistante"
  - "secretaire"
  - "comptable"
  - "controleur de gestion"
  - "juriste"
  - "acheteur"
  - "acheteuse"
  - "approvisionneur"
  - "logisticien"
  - "magasinier"
  - "ressources humaines"
  - "recruteur"
  - "recruiter"
  - "chargee de recrutement"
  - "charge de recrutement"
  - "sachbearbeiter"
  - "kaufmann"
  - "kauffrau"
  - "personalreferent"
  - "buchhalter"
  - "einkaufer"

staleness:
  applied: [14, 30]
  phd: [21, 45]

# Terms sent to ATS platforms that support server-side search (Workday).
# One query per term, results unioned, then filtered by role_families above.
# Keep this list short and distinctive: each term costs a request, and broad
# words like "engineer" return thousands of irrelevant rows.
poll_search_terms:
  - gnss
  - galileo
  - egnos
  - navigation
  - pnt
  - radar
  - sensor fusion
  - kalman
  - inertial
  - signal processing
  - orbit determination
  - r&t
  - research engineer
  - études amont
  # German tenants (Airbus DS is Workday and posts in German) search their own
  # text, so an English-only term list never reaches their postings.
  - signalverarbeitung
  - navigationssysteme
  - sensorfusion
  - regelungstechnik

# R&D and R&T describe the *kind* of work, not its subject. These terms lift a
# posting that already matched a role family below and do nothing to one that
# did not, which is what keeps "Research Scientist, Metallurgy" at zero while
# ranking "GNSS Research Engineer" above a plain GNSS role.
# There is deliberately no standalone research role family: research only
# counts here when it is research in radar, navigation or signal processing.
role_modifiers:
  weight: 0.20
  # Accents are folded before matching now, so a term needs listing once —
  # "études amont" and "etudes amont" are the same key.
  keywords: ["r&d", "r&t", "research", "recherche", "innovation",
             "advanced", "demonstrator", "prototype", "études amont",
             "phd", "doctoral", "doctorant", "these",
             "forschung", "entwicklung", "promotion", "doktorand"]

role_families:
  - name: gnss
    weight: 1.0
    keywords: ["gnss", "gps", "galileo", "egnos", "sbas", "waas", "glonass",
               "beidou", "receiver", "signal processing",
               "correlator", "acquisition and tracking", "rtk",
               # Bare "ppp" was removed: on consulting boards it is
               # public-private partnership, and "PPP Expert / Financial
               # Analyst" in Hyderabad outscored a real Toulouse GNSS role.
               "precise point positioning", "ppp-rtk",
               # The acronyms carry across languages; the supporting terms did
               # not, so a French or German posting never saturated its family
               # and ranked half a point below its English twin.
               "recepteur", "traitement du signal", "acquisition et poursuite",
               "positionnement precis",
               "empfanger", "signalverarbeitung", "satellitennavigation"]
  - name: pnt
    weight: 1.0
    keywords: ["pnt", "integrity", "spoofing", "jamming", "interference",
               "anti-jam", "raim", "resilient navigation", "timing",
               "brouillage", "anti-brouillage", "leurrage", "integrite",
               "datation", "synchronisation temporelle",
               "storunterdruckung", "storfestigkeit", "zeitsynchronisation"]
  - name: navigation_systems
    weight: 0.9
    # The French terms are not translations for tidiness: ONERA, CNES and the
    # Thales sites write their postings in French, and three real doctoral
    # offers (space-debris localisation, VTOL guidance, swarm localisation)
    # scored zero without them. "pilotage" alone is deliberately absent —
    # in French it usually means steering a project, not flying anything.
    keywords: ["navigation", "avionics", "guidance navigation and control",
               "gnc", "flight dynamics", "orbit determination",
               "navigation payload", "localisation", "guidage",
               "guidage-pilotage", "navigation inertielle",
               "centrale inertielle", "recalage",
               # CNES writes "dynamique du vol" where the English side writes
               # flight dynamics; without it their only in-domain opening
               # scored zero.
               "dynamique du vol", "mecanique spatiale",
               # German: DLR, OHB, Airbus DS and Beyond Gravity post in German
               # and had no keyword of their own until now.
               "tragheitsnavigation", "bahnbestimmung", "flugregelung",
               "flugdynamik", "ortung", "lageregelung", "navigationssystem"]
  - name: sensor_fusion
    weight: 0.9
    # Bare "estimation" was removed: it matched cost and quantity estimation
    # on consulting boards. The qualified forms carry the same signal.
    keywords: ["sensor fusion", "kalman", "inertial", "imu",
               "ins", "state estimation", "orbit estimation",
               "attitude estimation", "estimation theory", "slam",
               "fusion de données", "filtrage particulaire",
               "trajectographie", "poursuite de cible",
               "filtre de kalman", "estimation d'etat",
               "sensorfusion", "datenfusion", "zustandsschatzung",
               "kalman-filter", "tragheitssensorik"]
  - name: radar
    weight: 0.8
    keywords: ["radar", "sar", "doppler", "waveform", "beamforming",
               "electromagnetic", "rf front-end", "rf", "antenna", "microwave",
               "radio frequency", "electronic warfare", "phased array",
               "forme d'onde", "guerre electronique", "hyperfrequence",
               "antenne", "traitement radar",
               "wellenform", "elektromagnetisch", "mikrowelle",
               "hochfrequenz", "radartechnik", "antennenentwicklung"]
  - name: adjacent
    weight: 0.5
    keywords: ["autonomous driving", "geodesy", "remote sensing",
               "digital signal processing", "software defined radio"]

# Consultancies with no pollable board. These become pre-built LinkedIn
# searches on the Job Search tab — one per firm per domain — because LinkedIn
# has no public API and its terms forbid scraping. Firms whose board IS
# pollable (ALTEN, Assystem, Scalian) belong in employers.yaml instead, not
# here: listing them twice would mean opening searches for jobs already stored.
linkedin_companies:
  - Expleo
  - Akkodis
  - Capgemini Engineering
  - Sopra Steria
  - SEGULA Technologies
  - SII Group
  - Davidson Consulting
  - Amaris Consulting
  - HE Space
  - RHEA Group
