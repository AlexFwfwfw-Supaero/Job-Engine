[project]
name = "jobhunt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12", "httpx>=0.27", "jinja2>=3.1", "pyyaml>=6.0",
  # Arrives with httpx anyway, but snapshot.ssl_context() imports it directly.
  "certifi",
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional on purpose: the tracker is fully usable without a model. Only the
# enrich, insights and rank commands need this.
ai = ["anthropic>=0.40"]

[project.scripts]
jobs = "jobhunt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunt = ["templates/*.j2", "certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
